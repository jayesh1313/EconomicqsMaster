# Cloudflare Workers Configuration
# Deploy with: wrangler deploy

name = "credible-edutech-media-vault"
type = "javascript"
account_id = "your-account-id"
workers_dev = true
route = "media-vault.your-domain.com/*"
zone_id = "your-zone-id"

# Environment variables
[env.production]
name = "credible-edutech-media-vault-prod"
route = "media-vault.economicqsmaster.com/*"

[env.production.vars]
SUPABASE_URL = "https://your-project.supabase.co"
SUPABASE_ANON_KEY = "your-anon-key"
GOOGLE_PROJECT_ID = "your-project-id"
GOOGLE_SERVICE_ACCOUNT_EMAIL = "your-service-account@project.iam.gserviceaccount.com"

# Build configuration
[build]
command = ""
cwd = "./"
main = "media-vault-proxy.js"

# Triggers
[triggers.crons]
crons = ["0 0 * * *"]  # Daily health check

# Analytics
[analytics]
enabled = true

# Observability
[observability]
enabled = true
