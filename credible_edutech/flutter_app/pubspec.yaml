name: credible_edutech
description: CredibleEdutech - High-performance quantitative learning platform for Economicqsmaster.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.0
  bloc: ^8.1.0
  
  # Networking & HTTP
  dio: ^5.3.0
  connectivity_plus: ^5.0.0
  
  # Supabase & Authentication
  supabase_flutter: ^1.10.0
  
  # Video Player
  better_player: ^0.0.84
  
  # Local Storage & Caching
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Device Binding
  device_info_plus: ^9.0.0
  
  # Crypto & Encryption
  encrypt: ^5.0.3
  
  # Quantitative Analysis
  intl: ^0.19.0
  
  # UI/UX
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.0
  
  # Utilities
  equatable: ^2.0.5
  freezed_annotation: ^2.4.0
  json_serializable: ^6.7.0
  get_it: ^7.5.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
